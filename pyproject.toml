[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "horizonnet"
version = "1.0.0"
description = "Graph Attention Network for Credit Entity Risk Assessment"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Development Team", email = "dev@horizonnet.ai"}
]
keywords = [
    "graph-neural-networks",
    "attention",
    "credit-risk",
    "machine-learning",
    "fintech"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.2.0",
    "scikit-learn>=0.24.0",
    "scipy>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "coverage>=6.0",
    "black>=22.0.0",
    "pylint>=2.13.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]

[project.urls]
Homepage = "https://github.com/yourusername/HorizonNet"
Documentation = "https://horizonnet.readthedocs.io"
Repository = "https://github.com/yourusername/HorizonNet.git"
Issues = "https://github.com/yourusername/HorizonNet/issues"

[tool.setuptools]
packages = ["horizonnet"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["src/horizonnet"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
